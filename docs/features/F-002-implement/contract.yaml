schema_version: 1

metadata:
  id: "F-002-implement"
  title: "002 Implement command"
  status: "draft"
  critical: true

summary: |
  Add a `specdrive implement <FEATURE_ID>` command that reads the feature's
  spec and contract, performs basic validation, and prints a copy-paste-ready
  AI implementation prompt to stdout. The command is strictly read-only and
  does not call any external services.

scope:
  product: "specdrive"
  service: "specdrive-cli"
  repo: "specdrive"
  area: "cli"

requirements:
  high_level:
    - id: "HLR-001"
      text: "Provide a CLI command that generates an AI-ready implementation prompt from a feature spec and contract."
    - id: "HLR-002"
      text: "The command must be read-only and must not create, modify, or delete any files."
  low_level:
    - id: "LLR-001"
      parent: "HLR-001"
      text: "Given FEATURE_ID, resolve `.specify/specs/<FEATURE_ID>.spec.md` and `docs/features/<FEATURE_ID>/contract.yaml`."
    - id: "LLR-002"
      parent: "HLR-001"
      text: "If either file is missing or unreadable, print a clear error including the path and exit with a non-zero status."
    - id: "LLR-003"
      parent: "HLR-001"
      text: "On success, print a structured prompt that clearly delimits SPEC and CONTRACT sections, plus implementation guardrails."
    - id: "LLR-004"
      parent: "HLR-002"
      text: "The command must not create, modify, or delete any files."

assumptions:
  - id: "A-001"
    text: "Repo layout follows `.specify/specs/<FEATURE_ID>.spec.md` and `docs/features/<FEATURE_ID>/contract.yaml`."
  - id: "A-002"
    text: "The command is run from the repository root."

preconditions:
  - id: "P-001"
    text: "FEATURE_ID is a non-empty string."

impact:
  security:
    confidentiality: "low"  # may expose local spec/contract contents to AI via copy-paste
    integrity: "low"
    availability: "low"
    rationale: "Command only reads local files and prints to stdout; it does not modify code or production systems."
  privacy:
    pii_involved: false
    rationale: "Specs and contracts should not contain PII."

architecture:
  related_docs:
    - "docs/system-overview.md"
  constraints:
    - "No network calls."
    - "No file modifications."
    - "Only read files under the current repo."

cli:
  command: "implement"
  args:
    - "<FEATURE_ID>"
  flags: []
  description: "Generate an AI-ready implementation prompt for the given feature."
  exit_codes:
    - code: 0
      meaning: "Success."
    - code: 1
      meaning: "Usage error (e.g. missing FEATURE_ID)."
    - code: 2
      meaning: "Spec or contract file missing or unreadable."

behavior:
  steps:
    - "Parse CLI args and extract FEATURE_ID."
    - "Resolve spec path: `.specify/specs/<FEATURE_ID>.spec.md`."
    - "Resolve contract path: `docs/features/<FEATURE_ID>/contract.yaml`."
    - "If either file is missing, print a clear error mentioning the path; exit with code 2."
    - "Read both files as UTF-8 strings."
    - "Construct an AI prompt with clearly delimited SPEC and CONTRACT sections plus guardrails."
    - "Print the prompt to stdout only."
    - "Exit with code 0 on success."

logic:
  invariants:
    - "The command must not create, modify, or delete any files."
    - "The command must not make any network calls."
  error_conditions:
    - code: "MISSING_SPEC"
      description: "Spec file does not exist for the given FEATURE_ID."
      effect: "Print an error including the spec path and exit with code 2."
    - code: "MISSING_CONTRACT"
      description: "Contract file does not exist for the given FEATURE_ID."
      effect: "Print an error including the contract path and exit with code 2."
    - code: "READ_ERROR"
      description: "Spec or contract file exists but cannot be read."
      effect: "Print an error including the failing path and exit with code 2."

filesystem:
  creates_paths: []
  reads_paths:
    - ".specify/specs/<FEATURE_ID>.spec.md"
    - "docs/features/<FEATURE_ID>/contract.yaml"
  copies_templates: []
  must_not_modify:
    - ".specify/specs/<FEATURE_ID>.spec.md"
    - "docs/features/<FEATURE_ID>/contract.yaml"

integrations:
  tools: []

git_safety:
  require_clean_tree: false
  allow_untracked: true
  rationale: "Command is read-only and does not modify the working tree."

verification:
  strategy: ["unit", "integration"]
  test_cases:
    - id: "TC-001"
      requirement: "HLR-001"
      type: "integration"
      description: "With valid spec and contract for F-001-bootstrap, `specdrive implement F-001-bootstrap` prints a structured prompt and exits 0."
    - id: "TC-002"
      requirement: "LLR-002"
      type: "integration"
      description: "If the spec file is missing, the command prints an error including the spec path and exits with code 2."
    - id: "TC-003"
      requirement: "LLR-002"
      type: "integration"
      description: "If the contract file is missing, the command prints an error including the contract path and exits with code 2."
    - id: "TC-004"
      requirement: "LLR-004"
      type: "unit"
      description: "The command does not write to the filesystem (no new or modified files after running)."
  coverage_expectations:
    code: "statement"
    notes: "Exercise success path and all defined error conditions."

reviews:
  required: true
  checklist:
    - "Spec and contract agree on behavior, paths, and exit codes."
    - "Invariants (read-only, no network) are enforced in code."
    - "File paths and exit codes match the CLI description."
  status:
    reviewed_by: ""
    reviewed_at: ""

ai_instructions:
  - "Treat this contract as the source of truth for the `specdrive implement` command."
  - "Do not modify specs or contracts from this command; it must be read-only."
  - "Ensure error messages include the relevant file paths."
  - "Do not add any network calls or external dependencies."
  - "Prefer small, clear functions and explicit error handling."
