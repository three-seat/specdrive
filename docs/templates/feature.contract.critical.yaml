  - "Do not advance lifecycle state unless explicitly specified in this contract."
  - "Do not modify specs, constitution, ADRs, or templates."
  - "Every modifies_paths entry must include a justified reason."
  - "If anything is ambiguous, implement the safest conservative behavior and reject rather than write."